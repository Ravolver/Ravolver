name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        with:
          github_user_name: Ravolver
          outputs: |
            dist/github-snake.svg?color_snake=#7B2FBE&color_dots=#2d1b3d,#4a2c6a,#7B2FBE,#9b4dca,#c084fc
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7B2FBE&color_dots=#2d1b3d,#4a2c6a,#7B2FBE,#9b4dca,#c084fc
      
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          keep_files: true
